[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polixor"
version = "1.0.0"
description = "ניתוח שידורים ויצירת קליפים וShorts אוטומטית"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "aiofiles>=23.2",
    "SQLAlchemy>=2.0,<3.0",
    "yt-dlp>=2024.1.0",
    "numpy>=1.24,<3.0",
    "opencv-python-headless>=4.8,<5",
    "faster-whisper>=1.0,<2.0",
    "cryptography>=42.0",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.40"]
gui = ["opencv-python>=4.8,<5"]

[project.scripts]
polixor = "polixor.main:main"

[tool.setuptools.packages.find]
include = ["polixor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
